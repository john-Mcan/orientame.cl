version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Las versiones mayores llegan en PRs separados: pueden cambiar el HTML generado y conviene
      # revisarlas una a una.
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
